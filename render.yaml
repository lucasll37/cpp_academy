# Blueprint do Render: o site estático do C++ Academy em https://cpp.lucaslima.ai/
#
# É uma das aplicações da landing-page (www.lucaslima.ai), onde este repositório entra como submodule em
# applications/cpp-academy. O build monta _site/ com scripts/site.sh: a aula de src/syntax na raiz e a camada da
# casa (cortina, serifa e selo do autor, em public/ll/, sincronizada pela landing com `make design-sync`).
# Para publicar: no Render, New → Blueprint → este repositório; no DNS, cpp.lucaslima.ai como CNAME para o endereço
# .onrender.com do serviço. Depois, cada push no main que mexa nos caminhos do buildFilter publica sozinho.
services:
  - type: web
    name: cpp-academy
    runtime: static
    buildCommand: bash scripts/site.sh
    staticPublishPath: _site
    autoDeployTrigger: commit
    domains:
      - cpp.lucaslima.ai
    # O resto do repositório (C++, Meson, relatório) não muda o site: commits só ali não geram build.
    buildFilter:
      paths:
        - src/*/apresentacao/**
        - public/**
        - scripts/site.sh
        - render.yaml
    headers:
      # Nada tem hash no nome: as páginas e os assets são sempre revalidados (304 com ETag, sem corpo).
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # A camada da casa muda raramente.
      - path: /ll/*
        name: Cache-Control
        value: public, max-age=86400
      # 'unsafe-inline' só em style-src: os slides usam atributos style (cores de capítulo, --i das cascatas).
      # data: em img-src: os ícones dos callouts são máscaras SVG em data: URI, e o favicon também.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
          font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none';
          frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
