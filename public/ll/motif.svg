<svg xmlns="http://www.w3.org/2000/svg" width="480" height="96" class="motif motif-landscape" viewBox="0 0 480 96" preserveAspectRatio="xMidYMid meet"><style>.motif{display:block;overflow:visible;}.motif path,.motif circle{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;}.m-wire{stroke:#a39b8f;stroke-width:0.8px;}.m-wire.w1{stroke-opacity:0.16;}.m-wire.w2{stroke-opacity:0.3;}.m-wire.w3{stroke-opacity:0.5;}.m-px{stroke:#8f877b;stroke-opacity:0.45;stroke-width:2px;}.m-px-on{stroke:#ece7de;stroke-width:4.5px;}.m-node{stroke:#ece7de;stroke-width:5.5px;}.m-node.a1{stroke-opacity:0.32;}.m-node.a2{stroke-opacity:0.58;}.m-node.a3{stroke-opacity:0.92;}.m-halo{stroke:#a39b8f;stroke-opacity:0.7;stroke-width:1px;transition:stroke 220ms cubic-bezier(0.22,1,0.36,1);}.m-label{font:500 12px 'JetBrains Mono Variable','JetBrains Mono Fallback',ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#a39b8f;}.m-axis{stroke:#3a3530;stroke-width:1px;}.motif .m-band{fill:#ece7de;fill-opacity:0.035;}.motif .m-band-in{fill-opacity:0.055;}.m-sample{stroke:#a39b8f;stroke-opacity:0.26;stroke-width:0.8px;}.m-guide{stroke:#6e665c;stroke-width:1px;stroke-dasharray:2 5;}.m-ring{stroke:#a39b8f;stroke-width:1.7px;stroke-dasharray:0 4;}.m-ring.r1{stroke-opacity:0.35;}.m-ring.r2{stroke-opacity:0.6;}.m-ring.r3{stroke-opacity:0.85;}.m-sun{stroke-opacity:0.7;}.m-cell{stroke:#ece7de;stroke-width:3.5px;}.m-cell.a1{stroke-opacity:0.14;}.m-cell.a2{stroke-opacity:0.34;}.m-cell.a3{stroke-opacity:0.66;}.m-wall{stroke:#6e665c;stroke-width:2px;}.m-char{font:500 12px 'JetBrains Mono Variable','JetBrains Mono Fallback',ui-monospace,'SFMono-Regular',Menlo,monospace;fill:#8f877b;transition:fill 220ms cubic-bezier(0.22,1,0.36,1);}.m-char-q,.m-char-on{fill:#ece7de;}.m-bar{stroke:#a39b8f;stroke-opacity:0.4;stroke-width:3px;}.m-bar-on{stroke:#ece7de;stroke-opacity:0.85;}.motif .m-hot{vector-effect:none;stroke:#ece7de;stroke-width:1.7;transition:stroke 220ms cubic-bezier(0.22,1,0.36,1);}.